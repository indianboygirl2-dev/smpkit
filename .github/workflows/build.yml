name: Build SMPKit
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip SMPKit-source.zip
      - run: cd SMPKit && mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: SMPKit-jar
          path: SMPKit/target/SMPKit-*.jar
          
